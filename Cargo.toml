[package]
name = "aimeter"
version = "1.3.0"
edition = "2021"
description = "AI coding-tool usage as a statusline segment: Claude Code, and Codex beside it."
# Enough for crates.io to serve `cargo install aimeter`, which is the fallback the
# README already points at for platforms with no prebuilt binary. No `exclude`:
# every tracked file here fits in a rounding error, and a stale exclude list that
# drops the README's own images is a worse outcome than shipping 20 KB of SVG.
license = "MIT"
repository = "https://github.com/MarioPayan/AImeter"
readme = "README.md"
keywords = ["claude", "codex", "statusline", "usage", "rate-limit"]
categories = ["command-line-utilities"]
rust-version = "1.89"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# TLS comes from ureq's defaults (rustls). Blocking, because the one request this
# makes happens in a short-lived child process that exists only to make it.
ureq = { version = "2", features = ["json"] }

# `aimeter line` runs on every statusline render. Optimise it even for `cargo run`,
# and strip the binary so an always-installed tool stays small.
[profile.release]
opt-level = 3
strip = true

[profile.dev]
opt-level = 1
