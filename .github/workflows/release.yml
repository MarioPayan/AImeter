name: release

# Prebuilt binaries so nobody has to install Rust to use a statusline segment.
# Tag a version and this attaches one tarball per platform, each with a .sha256
# beside it that `install.sh` verifies before unpacking.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # --verify-tag so a mistyped tag fails here rather than producing an empty
      # release that install.sh would then 404 against. The notes say which file to
      # take, because "four tarballs, no guidance" is not a download page.
      - env:
          GH_TOKEN: ${{ github.token }}
        # --draft, published by the last job: `releases/latest` ignores drafts, so
        # installs keep serving the previous complete release instead of hitting a
        # minute-long window where the new one exists with no assets — a window the
        # CDN then negative-caches into failed installs for anyone who raced it.
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes '
          Your Claude Code rate limits, in the statusline. Grab the binary for your
          machine, `tar -xzf` it, and put `aimeter` on your `PATH`. Every tarball
          has a `.sha256` beside it.

          | Platform | File |
          |---|---|
          | Linux, Intel/AMD | `aimeter-x86_64-unknown-linux-gnu.tar.gz` |
          | Linux, ARM | `aimeter-aarch64-unknown-linux-gnu.tar.gz` |
          | macOS, Apple silicon | `aimeter-aarch64-apple-darwin.tar.gz` |
          | macOS, Intel | `aimeter-x86_64-apple-darwin.tar.gz` |

          Or let the installer pick and verify:

          ```
          curl -fsSL https://raw.githubusercontent.com/MarioPayan/AImeter/main/install.sh | sh
          ```

          Setup and what every part of the segment means:
          https://github.com/MarioPayan/AImeter#readme
          '

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # A native ARM runner, so no cross toolchain to maintain.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: rustup default 1.89.0
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: tar -czf "aimeter-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" aimeter
      # shasum is present on both the Linux and macOS runners; sha256sum is not on
      # macOS. One tool, both platforms, same output shape.
      - run: shasum -a 256 "aimeter-${{ matrix.target }}.tar.gz" > "aimeter-${{ matrix.target }}.tar.gz.sha256"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "aimeter-${{ matrix.target }}.tar.gz" "aimeter-${{ matrix.target }}.tar.gz.sha256" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
