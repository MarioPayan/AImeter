name: release

# Prebuilt binaries so nobody has to install Rust to use a statusline segment.
# Tag a version and this attaches one tarball per platform to the release that
# `install.sh` downloads from.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # --verify-tag so a mistyped tag fails here rather than producing an empty
      # release that install.sh would then 404 against.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: rustup default 1.89.0
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: tar -czf "aimeter-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" aimeter
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "aimeter-${{ matrix.target }}.tar.gz" --clobber
